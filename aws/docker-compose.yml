services:
  app:
    build:
      context: ..
      dockerfile: aws/app.Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ${MEETLY_DATA:-/opt/meetly/data}:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
